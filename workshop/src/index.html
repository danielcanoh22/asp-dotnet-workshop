<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>ASP.NET Core Workshop</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tutoriales guiados para aprender ASP.NET Core paso a paso en Visual Studio 2026.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap">
  <script>
    // Apply the stored theme before the first paint to avoid a flash of the wrong palette.
    try {
      var t = localStorage.getItem('aspnet-workshop.theme.v1');
      if (t === 'light' || t === 'dark') { document.documentElement.setAttribute('data-theme', t); }
    } catch (e) { /* storage unavailable: fall back to the system preference */ }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
